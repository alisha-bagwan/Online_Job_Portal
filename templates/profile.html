<!DOCTYPE html>
<html>
<head>

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Job Portal
        </a>

        <a href="/dashboard" class="btn btn-outline-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-5">

                    <h2 class="mb-4">
                        My Profile
                    </h2>

                    <hr>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ user[0] }}"
                            readonly>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ user[1] }}"
                            readonly>

                    </div>

                    {% if user[2] %}

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Resume
                        </label>

                        <br>

                        <a href="/static/resumes/{{ user[2] }}"
                           target="_blank"
                           class="btn btn-outline-dark">

                            View Resume

                        </a>

                    </div>

                    {% endif %}

                    <hr>

                    <div class="d-flex flex-wrap gap-2">

                        <a href="/edit-profile"
                           class="btn btn-dark">
                            Edit Profile
                        </a>

                        <a href="/upload-resume"
                           class="btn btn-outline-dark">
                            Upload Resume
                        </a>

                        <a href="/my-applications"
                           class="btn btn-outline-dark">
                            My Applications
                        </a>

                        <a href="/dashboard"
                           class="btn btn-secondary">
                            Back to Dashboard
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
