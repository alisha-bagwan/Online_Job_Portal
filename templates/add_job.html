<!DOCTYPE html>
<html>
<head>

    <title>Add Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Job Portal
        </a>

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        Add New Job
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Enter Job Title"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Company Name
                            </label>

                            <input
                                type="text"
                                name="company"
                                class="form-control"
                                placeholder="Enter Company Name"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="Enter Location"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Salary
                            </label>

                            <input
                                type="text"
                                name="salary"
                                class="form-control"
                                placeholder="Enter Salary"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Job Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Enter Job Description"
                                required></textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">
                            Add Job
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
